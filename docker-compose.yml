services:
  # PostgreSQL Database
  database:
    image: postgres:15-alpine
    container_name: futbol_clinic_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-futbol_clinic}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-futbol_migrator}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
      APP_DB_USER: ${APP_DB_USER:-futbol_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
      - ./database/backups:/backups
    ports:
      - "5432:5432"
    networks:
      - futbol_clinic_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER:-futbol_migrator} -d ${POSTGRES_DB:-futbol_clinic}"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: "no"
    depends_on:
      database:
        condition: service_healthy
    environment:
      NODE_ENV: production
      MIGRATOR_DATABASE_URL: ${MIGRATOR_DATABASE_URL:?Set MIGRATOR_DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
    command: ["node", "dist/scripts/migrate.js"]
    networks:
      - futbol_clinic_network

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: futbol_clinic_backend
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?Set the non-superuser DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${FRONTEND_URL:?Set the public FRONTEND_URL in .env}
      BACKEND_URL: ${BACKEND_URL:?Set the public BACKEND_URL in .env}
      PORT: 4000
      BLOB_READ_WRITE_TOKEN: ${BLOB_READ_WRITE_TOKEN:-}
      PRIVATE_BLOB_READ_WRITE_TOKEN: ${PRIVATE_BLOB_READ_WRITE_TOKEN:?Set the private Blob token in .env}
      GMAIL_USER: ${GMAIL_USER:-}
      GMAIL_PASS: ${GMAIL_PASS:-}
      EMAIL_MOCK: ${EMAIL_MOCK:-true}
      # Database optimization
      DATABASE_MAX_CONNECTIONS: 20
      DATABASE_IDLE_TIMEOUT: 30000
      DATABASE_CONNECTION_TIMEOUT: 10000
    volumes:
      - ./uploads:/app/public/uploads
      - ./logs:/app/logs
    ports:
      - "4000:4000"
    networks:
      - futbol_clinic_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Next.js Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api
        INTERNAL_BACKEND_URL: http://backend:4000
        DOCKER_ENV: "true"
    container_name: futbol_clinic_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      INTERNAL_BACKEND_URL: http://backend:4000
      DOCKER_ENV: "true"
    ports:
      - "3000:3000"
    networks:
      - futbol_clinic_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3


# Networks
networks:
  futbol_clinic_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# Volumes for data persistence
volumes:
  postgres_data:
    driver: local